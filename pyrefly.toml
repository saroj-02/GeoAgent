project-includes = [
    "backend/**/*.py"
]

project-excludes = [
    "**/.venv/**",
    "**/venv/**",
    "**/__pycache__/**",
    "**/node_modules/**",
    "**/.next/**",
    "frontend/**"
]

search-path = [
    "backend"
]

python-interpreter-path = "venv/bin/python"

python-platform = "darwin"

python-version = "3.14"